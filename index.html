<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZrazTrack - Zone 2 Sync</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- PWA & Mobile Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZrazTrack">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23090d16%22/><text y=%22.9em%22 font-size=%2280%22>⚡</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zraz: {
                            bg: '#090d16',
                            card: '#121826',
                            border: '#1f293d',
                            cyan: '#00f2fe',
                            pink: '#ff007f',
                            yellow: '#ffdd00',
                            text: '#f3f4f6',
                            muted: '#9ca3af'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090d16;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .neon-glow-cyan {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        .neon-glow-pink {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
        }
        .neon-text-pink {
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 4px;
        }
    </style>

    <!-- Firebase JS SDK v9 (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen pb-24">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-[#090d16]/90 backdrop-blur-md border-b border-zraz-border px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="px-3 py-1 rounded-full border border-zraz-pink bg-zraz-pink/10 neon-glow-pink">
                    <span class="text-xs font-black tracking-widest text-zraz-pink uppercase">⚡ ZRAZNE ⚡</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <div id="syncStatusIcon" title="Connecting to Firebase...">
                    <svg id="wifiOff" class="w-5 h-5 text-zraz-yellow animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 012.121-12.728M3 3l18 18"></path>
                    </svg>
                    <svg id="wifiOn" class="w-5 h-5 text-zraz-cyan hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="max-w-md mx-auto mt-3 flex items-center justify-between bg-zraz-card p-1.5 rounded-xl border border-zraz-border text-xs">
            <span class="text-zraz-muted font-semibold uppercase px-2">Viewing As:</span>
            <div class="flex space-x-1" id="userSelector">
                <button onclick="switchUser('Luke')" id="btn-Luke" class="px-3 py-1 rounded-lg font-bold transition-all">Luke</button>
                <button onclick="switchUser('Ross')" id="btn-Ross" class="px-3 py-1 rounded-lg font-bold transition-all">Ross</button>
                <button onclick="switchUser('Elliot')" id="btn-Elliot" class="px-3 py-1 rounded-lg font-bold transition-all">Elliot</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-6">

        <section class="bg-zraz-card border border-zraz-border rounded-2xl p-4 shadow-xl">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <span class="text-[10px] font-bold tracking-wider uppercase text-zraz-cyan">⚡ Zone 2 Boyz Live Sync</span>
                    <h1 class="text-xl font-extrabold text-white">Luke, Ross & Elliot</h1>
                </div>
                <button onclick="resetToDefaults()" class="text-[10px] text-zraz-muted hover:text-zraz-pink border border-zraz-border px-2 py-1 rounded-md transition-colors">
                    ↺ Reset Data
                </button>
            </div>
            
            <div class="grid grid-cols-3 gap-2 mt-4 text-center">
                <div class="bg-zraz-bg/60 p-2 rounded-xl border border-zraz-border">
                    <span class="text-[10px] text-zraz-muted block uppercase">Today Active</span>
                    <span id="stat-active" class="text-base font-black text-zraz-cyan">0 mins</span>
                </div>
                <div class="bg-zraz-bg/60 p-2 rounded-xl border border-zraz-border">
                    <span class="text-[10px] text-zraz-muted block uppercase">Active Goals</span>
                    <span id="stat-goals" class="text-base font-black text-zraz-yellow">0 Active</span>
                </div>
                <div class="bg-zraz-bg/60 p-2 rounded-xl border border-zraz-border">
                    <span class="text-[10px] text-zraz-muted block uppercase">Target Date</span>
                    <span class="text-xs font-bold text-zraz-pink block mt-1">Dec 31, '26</span>
                </div>
            </div>
        </section>

        <!-- View 1: Home Dashboard -->
        <div id="view-home" class="space-y-6">
            <section class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-sm font-bold tracking-wider text-zraz-muted uppercase flex items-center gap-1.5">
                        <span class="text-zraz-pink">⚡</span> Trio Shared Live Goals
                    </h2>
                    <span class="text-xs text-zraz-cyan cursor-pointer" onclick="switchTab('goals')">Manage &rsaquo;</span>
                </div>

                <div id="userGoalsList" class="space-y-4">
                </div>
            </section>

            <section class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-sm font-bold tracking-wider text-zraz-muted uppercase flex items-center gap-1.5">
                        <span class="text-zraz-yellow">🔥</span> Live Zrazne Activity Feed
                    </h2>
                    <span id="modeBadge" class="text-[10px] font-mono px-2 py-0.5 rounded border border-zraz-border text-zraz-muted">SYNCING...</span>
                </div>

                <div id="activityFeed" class="bg-zraz-card border border-zraz-border rounded-2xl p-3 max-h-60 overflow-y-auto space-y-2">
                    <p class="text-xs text-zraz-muted text-center py-4">Loading team updates...</p>
                </div>
            </section>
        </div>

        <!-- View 2: Goals & Schedule Setup -->
        <div id="view-goals" class="space-y-6 hidden">
            <section class="bg-zraz-card border border-zraz-border rounded-2xl p-4 space-y-4">
                <h2 class="text-base font-extrabold text-white flex items-center gap-2">
                    <span>🎯</span> My Personal Goal Setup (<span id="currentUserLabel">Luke</span>)
                </h2>

                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-zraz-muted mb-1 font-semibold">Body Weight Target (lbs)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="input-weight-current" placeholder="Current (e.g. 210)" class="bg-zraz-bg border border-zraz-border rounded-xl p-2 text-white focus:border-zraz-cyan outline-none">
                            <input type="number" id="input-weight-target" placeholder="Target (e.g. 195)" class="bg-zraz-bg border border-zraz-border rounded-xl p-2 text-white focus:border-zraz-cyan outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-zraz-muted mb-1 font-semibold">Daily Active Minutes Goal</label>
                        <input type="number" id="input-daily-mins" placeholder="Minutes per day (e.g. 60)" class="bg-zraz-bg border border-zraz-border rounded-xl p-2 w-full text-white focus:border-zraz-cyan outline-none">
                    </div>

                    <div>
                        <label class="block text-zraz-muted mb-1 font-semibold">Weekly Strength/Cardio Target</label>
                        <input type="text" id="input-weekly-target" placeholder="e.g. 5 Workouts / Week" class="bg-zraz-bg border border-zraz-border rounded-xl p-2 w-full text-white focus:border-zraz-cyan outline-none">
                    </div>

                    <button onclick="saveGoalSettings()" class="w-full py-2.5 bg-zraz-cyan text-zraz-bg font-black rounded-xl hover:opacity-90 transition-opacity">
                        Save Goals & Sync
                    </button>
                </div>
            </section>
        </div>

    </main>

    <!-- Log Activity Modal -->
    <div id="logModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4 hidden">
        <div class="bg-zraz-card border border-zraz-border rounded-3xl w-full max-w-md p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zraz-border pb-3">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                    <span class="text-zraz-pink">⚡</span> Log Workout or Progress
                </h3>
                <button onclick="toggleLogModal(false)" class="text-zraz-muted hover:text-white text-lg font-bold">&times;</button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-zraz-muted mb-1 font-semibold">Activity / Category</label>
                    <select id="log-type" class="bg-zraz-bg border border-zraz-border rounded-xl p-2.5 w-full text-white focus:border-zraz-cyan outline-none">
                        <option value="weight">Scale Weight Update (lbs)</option>
                        <option value="activity">Active Minutes (Zone 2 / Run / KB)</option>
                        <option value="workout">Completed Scheduled Workout</option>
                        <option value="custom">Custom Goal Milestone</option>
                    </select>
                </div>

                <div>
                    <label class="block text-zraz-muted mb-1 font-semibold">Value / Amount</label>
                    <input type="text" id="log-value" placeholder="e.g. 208.5 or 45 mins" class="bg-zraz-bg border border-zraz-border rounded-xl p-2.5 w-full text-white focus:border-zraz-cyan outline-none">
                </div>

                <div>
                    <label class="block text-zraz-muted mb-1 font-semibold">Notes / Shoutout (Optional)</label>
                    <input type="text" id="log-notes" placeholder="e.g. Morning Zone 2 run felt super clean!" class="bg-zraz-bg border border-zraz-border rounded-xl p-2.5 w-full text-white focus:border-zraz-cyan outline-none">
                </div>

                <button onclick="submitLogEntry()" class="w-full py-3 bg-gradient-to-r from-zraz-cyan to-zraz-pink text-white font-black rounded-xl neon-glow-cyan hover:opacity-95 transition-opacity mt-2">
                    Submit Entry to Trio Feed
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#090d16]/95 backdrop-blur-md border-t border-zraz-border py-2 px-6 z-40">
        <div class="max-w-md mx-auto flex justify-around items-center relative">
            
            <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center text-zraz-cyan">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span class="text-[10px] font-bold mt-1">Home</span>
            </button>

            <button onclick="toggleLogModal(true)" class="relative -top-5 bg-gradient-to-tr from-zraz-pink to-zraz-cyan p-3.5 rounded-full text-white shadow-lg neon-glow-pink hover:scale-105 transition-transform">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>

            <button onclick="switchTab('goals')" id="tab-goals" class="flex flex-col items-center text-zraz-muted hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <span class="text-[10px] font-bold mt-1">Goals</span>
            </button>

        </div>
    </nav>

    <!-- Application Script Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSE6mEUKtDBrDRNZoNFs6iZNjuIzEwC20",
            authDomain: "zraztrack.firebaseapp.com",
            projectId: "zraztrack",
            storageBucket: "zraztrack.firebasestorage.app",
            messagingSenderId: "650484616845",
            appId: "1:650484616845:web:19cc6718aa8a4fc4395cc4",
            measurementId: "G-N5CC832YQW"
        };

        let db = null;
        let isOnlineSync = false;

        const DEFAULT_STATE = {
            users: {
                Luke: {
                    weightCurrent: 208,
                    weightTarget: 195,
                    dailyMinsGoal: 60,
                    todayMins: 45,
                    weeklyTarget: '5 Workouts / Week',
                    weeklyDone: 3
                },
                Ross: {
                    weightCurrent: 185,
                    weightTarget: 175,
                    dailyMinsGoal: 45,
                    todayMins: 30,
                    weeklyTarget: '4 Workouts / Week',
                    weeklyDone: 2
                },
                Elliot: {
                    weightCurrent: 190,
                    weightTarget: 180,
                    dailyMinsGoal: 60,
                    todayMins: 60,
                    weeklyTarget: '5 Workouts / Week',
                    weeklyDone: 4
                }
            },
            feed: []
        };

        let appData = JSON.parse(localStorage.getItem('zraztrack_local')) || DEFAULT_STATE;
        let currentUser = 'Luke';

        async function initFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                
                await firebase.auth().signInAnonymously();
                db = firebase.firestore();

                setSyncStatus(true);

                // Real-time listener for user state & targets
                db.collection('artifacts').doc('zraztrack_state')
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            appData.users = doc.data().users || DEFAULT_STATE.users;
                            localStorage.setItem('zraztrack_local', JSON.stringify(appData));
                            renderUI();
                        } else {
                            saveToFirebase(appData);
                        }
                    }, (error) => {
                        console.warn("Firestore sync warning:", error);
                        setSyncStatus(false);
                    });

                // Real-time listener for sub-collection feed items
                db.collection('artifacts').doc('zraztrack_state')
                    .collection('feed')
                    .orderBy('timestamp', 'desc')
                    .limit(20)
                    .onSnapshot((snapshot) => {
                        appData.feed = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        localStorage.setItem('zraztrack_local', JSON.stringify(appData));
                        renderUI();
                    }, (error) => {
                        console.warn("Feed sub-collection sync warning:", error);
                    });

            } catch (err) {
                console.warn("Firebase Init Error:", err);
                setSyncStatus(false);
                renderUI();
            }
        }

        async function saveToFirebase(data) {
            localStorage.setItem('zraztrack_local', JSON.stringify(data));
            if (db && isOnlineSync) {
                try {
                    await db.collection('artifacts').doc('zraztrack_state').set({
                        users: data.users
                    }, { merge: true });
                } catch (err) {
                    console.error("Error pushing state to Firestore:", err);
                }
            }
        }

        function setSyncStatus(online) {
            isOnlineSync = online;
            const wifiOn = document.getElementById('wifiOn');
            const wifiOff = document.getElementById('wifiOff');
            const badge = document.getElementById('modeBadge');

            if (online) {
                wifiOn.classList.remove('hidden');
                wifiOff.classList.add('hidden');
                badge.innerText = 'LIVE FIREBASE SYNC';
                badge.className = 'text-[10px] font-mono px-2 py-0.5 rounded border border-zraz-cyan text-zraz-cyan bg-zraz-cyan/10';
            } else {
                wifiOn.classList.add('hidden');
                wifiOff.classList.remove('hidden');
                badge.innerText = 'LOCAL MODE';
                badge.className = 'text-[10px] font-mono px-2 py-0.5 rounded border border-zraz-yellow text-zraz-yellow bg-zraz-yellow/10';
            }
        }

        function initUserFromURL() {
            const params = new URLSearchParams(window.location.search);
            const urlUser = params.get('user');
            if (urlUser && ['luke', 'ross', 'elliot'].includes(urlUser.toLowerCase())) {
                currentUser = urlUser.charAt(0).toUpperCase() + urlUser.slice(1).toLowerCase();
            }
            updateUserSelectorUI();
        }

        function switchUser(user) {
            currentUser = user;
            updateUserSelectorUI();
            renderUI();
        }

        function updateUserSelectorUI() {
            ['Luke', 'Ross', 'Elliot'].forEach(u => {
                const btn = document.getElementById(`btn-${u}`);
                if (u === currentUser) {
                    btn.className = "px-3 py-1 rounded-lg font-bold bg-zraz-pink text-white neon-glow-pink";
                } else {
                    btn.className = "px-3 py-1 rounded-lg font-bold text-zraz-muted hover:text-white";
                }
            });
            document.getElementById('currentUserLabel').innerText = currentUser;
        }

        function switchTab(tab) {
            const homeView = document.getElementById('view-home');
            const goalsView = document.getElementById('view-goals');
            const tabHome = document.getElementById('tab-home');
            const tabGoals = document.getElementById('tab-goals');

            if (tab === 'home') {
                homeView.classList.remove('hidden');
                goalsView.classList.add('hidden');
                tabHome.className = 'flex flex-col items-center text-zraz-cyan';
                tabGoals.className = 'flex flex-col items-center text-zraz-muted hover:text-white';
            } else {
                homeView.classList.add('hidden');
                goalsView.classList.remove('hidden');
                tabHome.className = 'flex flex-col items-center text-zraz-muted hover:text-white';
                tabGoals.className = 'flex flex-col items-center text-zraz-cyan';
                populateGoalsForm();
            }
        }

        function renderUI() {
            const container = document.getElementById('userGoalsList');
            container.innerHTML = '';

            let totalActiveMins = 0;
            let activeGoalsCount = 0;

            Object.keys(appData.users).forEach(uName => {
                const uData = appData.users[uName];
                totalActiveMins += (uData.todayMins || 0);
                if (uData.weightTarget) activeGoalsCount++;

                const weightProgress = Math.min(100, Math.max(5, Math.round((uData.weightTarget / uData.weightCurrent) * 100)));
                const minsProgress = Math.min(100, Math.round(((uData.todayMins || 0) / (uData.dailyMinsGoal || 60)) * 100));

                const card = document.createElement('div');
                card.className = "bg-zraz-card border border-zraz-border rounded-2xl p-4 space-y-3";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-tr ${uName === 'Luke' ? 'from-zraz-cyan to-blue-600' : uName === 'Ross' ? 'from-zraz-yellow to-orange-500' : 'from-zraz-pink to-purple-600'} flex items-center justify-center font-extrabold text-white text-sm shadow">
                                ${uName.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-extrabold text-white text-sm">${uName}</h3>
                                <span class="text-[10px] text-zraz-muted">Zone 2 Sync Member</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1 text-xs text-zraz-yellow">
                            <span>🔥</span> <span>💪</span>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <span class="text-zraz-muted font-semibold">⚡ Drop Body Weight to ${uData.weightTarget}lbs</span>
                            <span class="text-white font-bold">${uData.weightCurrent} / ${uData.weightTarget} lbs</span>
                        </div>
                        <div class="w-full bg-zraz-bg rounded-full h-2 border border-zraz-border overflow-hidden">
                            <div class="bg-gradient-to-r from-zraz-cyan to-blue-500 h-2 rounded-full" style="width: ${weightProgress}%"></div>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <span class="text-zraz-muted font-semibold">⚡ ${uData.dailyMinsGoal} mins of daily activity</span>
                            <span class="text-white font-bold">${uData.todayMins || 0} / ${uData.dailyMinsGoal} mins</span>
                        </div>
                        <div class="w-full bg-zraz-bg rounded-full h-2 border border-zraz-border overflow-hidden">
                            <div class="bg-gradient-to-r from-zraz-pink to-zraz-yellow h-2 rounded-full" style="width: ${minsProgress}%"></div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('stat-active').innerText = `${totalActiveMins} mins`;
            document.getElementById('stat-goals').innerText = `${activeGoalsCount} Active`;

            const feedContainer = document.getElementById('activityFeed');
            feedContainer.innerHTML = '';
            
            if (!appData.feed || appData.feed.length === 0) {
                feedContainer.innerHTML = `<p class="text-xs text-zraz-muted text-center py-4">No recent activity logged yet.</p>`;
            } else {
                appData.feed.forEach(item => {
                    const el = document.createElement('div');
                    el.className = "flex items-start justify-between bg-zraz-bg/50 p-2.5 rounded-xl border border-zraz-border/60 text-xs";
                    el.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <span class="text-sm">${item.text && item.text.includes('weight') ? '⚖️' : '⚡'}</span>
                            <div>
                                <span class="font-bold text-white">${item.user}</span>
                                <span class="text-zraz-muted">${item.text}</span>
                            </div>
                        </div>
                        <span class="text-[10px] text-zraz-muted font-mono whitespace-nowrap ml-2">${item.time || 'Just now'}</span>
                    `;
                    feedContainer.appendChild(el);
                });
            }
        }

        function populateGoalsForm() {
            const uData = appData.users[currentUser] || {};
            document.getElementById('input-weight-current').value = uData.weightCurrent || '';
            document.getElementById('input-weight-target').value = uData.weightTarget || '';
            document.getElementById('input-daily-mins').value = uData.dailyMinsGoal || '';
            document.getElementById('input-weekly-target').value = uData.weeklyTarget || '';
        }

        async function saveGoalSettings() {
            const currentW = parseFloat(document.getElementById('input-weight-current').value);
            const targetW = parseFloat(document.getElementById('input-weight-target').value);
            const mins = parseInt(document.getElementById('input-daily-mins').value);
            const weekly = document.getElementById('input-weekly-target').value;

            if (!appData.users[currentUser]) appData.users[currentUser] = {};

            if (currentW) appData.users[currentUser].weightCurrent = currentW;
            if (targetW) appData.users[currentUser].weightTarget = targetW;
            if (mins) appData.users[currentUser].dailyMinsGoal = mins;
            if (weekly) appData.users[currentUser].weeklyTarget = weekly;

            saveToFirebase(appData);

            if (db && isOnlineSync) {
                try {
                    await db.collection('artifacts').doc('zraztrack_state')
                        .collection('feed')
                        .add({
                            user: currentUser,
                            text: 'updated personal goals & targets',
                            time: 'Just now',
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                } catch (err) {
                    console.error("Error adding feed entry:", err);
                }
            }

            renderUI();
            switchTab('home');
        }

        function toggleLogModal(show) {
            const modal = document.getElementById('logModal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        async function submitLogEntry() {
            const type = document.getElementById('log-type').value;
            const val = document.getElementById('log-value').value;
            const notes = document.getElementById('log-notes').value;

            if (!val) {
                alert("Please enter a value or amount.");
                return;
            }

            let logText = '';
            if (type === 'weight') {
                const w = parseFloat(val);
                if (w) appData.users[currentUser].weightCurrent = w;
                logText = `logged new scale weight: ${val} lbs`;
            } else if (type === 'activity') {
                const mins = parseInt(val) || 30;
                appData.users[currentUser].todayMins = (appData.users[currentUser].todayMins || 0) + mins;
                logText = `logged ${val} active minutes (${notes || 'Zone 2 Cardio'})`;
            } else {
                logText = `logged activity: ${val} ${notes ? '(' + notes + ')' : ''}`;
            }

            saveToFirebase(appData);

            if (db && isOnlineSync) {
                try {
                    await db.collection('artifacts').doc('zraztrack_state')
                        .collection('feed')
                        .add({
                            user: currentUser,
                            text: logText,
                            time: 'Just now',
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                } catch (err) {
                    console.error("Error adding feed entry:", err);
                }
            }

            renderUI();
            toggleLogModal(false);

            document.getElementById('log-value').value = '';
            document.getElementById('log-notes').value = '';
        }

        function resetToDefaults() {
            if (confirm("Reset all user goals back to default state?")) {
                appData.users = JSON.parse(JSON.stringify(DEFAULT_STATE.users));
                saveToFirebase(appData);
                renderUI();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initUserFromURL();
            initFirebase();
            renderUI();
        });
    </script>
</body>
</html>
